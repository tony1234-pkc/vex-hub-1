<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Side Menu Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            z-index: 99;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 100;
            transition: right 0.3s ease;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-close {
            align-self: flex-end;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .sidebar a {
            color: var(--text-color);
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .sidebar a:hover {
            background-color: rgba(255,255,255,0.05);
        }

        /* Container */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Links Section */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .link-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .link-card i {
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        /* Chat Section */
        .chat-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 380px;
            overflow: hidden;
        }

        .chat-header {
            padding: 0.8rem 1rem;
            background-color: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            background-color: #21262d;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
        }

        .message .user {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 3px;
        }

        .chat-input-area {
            padding: 0.8rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #0d0f12;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .chat-input-area button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input-area button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-layer-group"></i> VEX Hub
        </div>
        <button class="menu-btn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- Sidebar Overlay & Menu -->
    <div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="toggleMenu()">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <a href="#"><i class="fa-solid fa-house"></i> الصفحة الرئيسية</a>
        <a href="#"><i class="fa-brands fa-discord"></i> ديسكورد</a>
        <a href="#"><i class="fa-solid fa-gear"></i> الإعدادات</a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Useful Links -->
        <div class="links-grid">
            <a href="https://discord.com" target="_blank" class="link-card">
                <i class="fa-brands fa-discord"></i>
                سيرفر الديسكورد
            </a>
            <a href="#" class="link-card">
                <i class="fa-solid fa-server"></i>
                سيرفر اللعبة
            </a>
            <a href="#" class="link-card">
                <i class="fa-solid fa-book"></i>
                القوانين والشروط
            </a>
        </div>

        <!-- Live Chat Box -->
        <div class="chat-container">
            <div class="chat-header">
                <i class="fa-solid fa-comments"></i> الدردشة العامة
            </div>
            <div class="chat-messages" id="chatBox">
                <!-- Messages will appear here -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="اسمك..." style="max-width: 100px;">
                <input type="text" id="msgInput" placeholder="اكتب رسالة...">
                <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Toggle Sidebar
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                overlay.style.display = 'none';
            } else {
                sidebar.classList.add('active');
                overlay.style.display = 'block';
            }
        }

        // LocalStorage Chat Logic
        const chatBox = document.getElementById('chatBox');

        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('vex_chat_messages')) || [];
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                const msgEl = document.createElement('div');
                msgEl.className = 'message';
                msgEl.innerHTML = `<div class="user">${msg.user}</div><div>${msg.text}</div>`;
                chatBox.appendChild(msgEl);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const userInput = document.getElementById('userInput');
            const msgInput = document.getElementById('msgInput');
            
            const user = userInput.value.trim() || 'زائر';
            const text = msgInput.value.trim();

            if (text === '') return;

            const messages = JSON.parse(localStorage.getItem('vex_chat_messages')) || [];
            messages.push({ user, text });
            localStorage.setItem('vex_chat_messages', JSON.stringify(messages));

            msgInput.value = '';
            loadMessages();
        }

        // Initial Load
        loadMessages();
    </script>
</body>
</html>
